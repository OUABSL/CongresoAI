version: '3.8'

services:

  nginx:
    image: nginx:1.24.0
    container_name: nginx
    restart: on-failure
    volumes:
      - ../client/build:/usr/share/nginx/html
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - server
      - client
    networks:
      - mynetwork

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: client
    volumes:
      - ../client:/usr/app
      - /app/node_modules
    stdin_open: true
    networks:
      my-network:
        aliases:
          - client

  server:
    build:
      context: ../
      dockerfile: server/Dockerfile
    env_file:
      - ../server/.env
    container_name: server
    command: 
      gunicorn --bind 0.0.0.0:5000 --workers 4 "app:app"    
    volumes:
      - ../server:/var/www/server
    expose:
      - "5000"
    networks:
      my-network:
        aliases:
          - server

networks:
  mynetwork: